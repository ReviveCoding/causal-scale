name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: |
          grep -v '^-e \.[[:space:]]*$' requirements.lock > "${RUNNER_TEMP}/causal-scale-requirements.lock"
          python -m pip install --no-deps --require-hashes -r "${RUNNER_TEMP}/causal-scale-requirements.lock"
          python -m pip install --no-deps .

      - name: Check formatting and lint
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts

      - name: Check governed types
        run: mypy src

      - name: Run public synthetic tests
        run: |
          mkdir -p .local-runs
          pytest -q -m "not spark" --ignore=tests/test_historical_reference.py --basetemp=.local-runs/pytest-public-unit

      - name: Run small Spark parity fixture
        run: pytest -q tests/test_spark_fixture.py --basetemp=.local-runs/pytest-public-spark
        timeout-minutes: 10

      - name: Build package
        run: python -m build --no-isolation --outdir dist

      - name: Smoke-test clean wheel install
        run: |
          python -m venv .ci-wheel
          .ci-wheel/bin/python -m pip install --no-deps dist/*.whl
          .ci-wheel/bin/python -c "import causal_scale; print(causal_scale.__version__)"

      - name: Audit public release candidate
        run: python scripts/audit_public_release.py --strict
